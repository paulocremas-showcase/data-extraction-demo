name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read  # least privilege: this workflow only ever reads the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned, never a mutable tag (Constitution Pillar 1, supply-chain integrity).
      # Re-resolve with: gh api repos/actions/checkout/git/ref/tags/vX.Y.Z --jq .object.sha
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit

      # Lint + security ruleset (S = bandit rules) + complexity ceiling, config in pyproject.toml.
      - name: Static analysis
        run: ruff check --select E,F,S,C90 .

      # The actual test gate. Job fails if the suite fails, it does not just report.
      - name: Tests
        run: python tests/test_pipeline.py

      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt
